<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نقطة بيع | متجر الهواتف</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F8FA;
    --surface: #FFFFFF;
    --ink: #10233B;
    --ink-soft: #5C7290;
    --brand: #0E4F6B;
    --brand-2: #0FA3A3;
    --accent: #FF7A45;
    --line: #E3EAF0;
  }
  *{ font-family: 'Tajawal', sans-serif; }
  h1,h2,h3,.font-display{ font-family: 'Cairo', sans-serif; }
  body{ background: var(--bg); color: var(--ink); }

  .scan-btn{
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
  }
  .scan-ring{
    position: absolute; inset: -6px; border-radius: 9999px;
    border: 2px solid var(--brand-2);
    animation: pulse-ring 2.2s cubic-bezier(0.4,0,0.6,1) infinite;
  }
  @keyframes pulse-ring{
    0% { transform: scale(0.85); opacity: 0.7; }
    70% { transform: scale(1.25); opacity: 0; }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce){
    .scan-ring{ animation: none; }
  }

  .barcode-mark{
    background-image: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 6px, transparent 6px 9px, var(--ink) 9px 10px, transparent 10px 14px);
    opacity: 0.06;
  }

  .card-tap:active{ transform: scale(0.97); }

  .fab-cart{
    background: linear-gradient(135deg, var(--brand-2) 0%, var(--brand) 100%);
    box-shadow: 0 10px 25px -8px rgba(14,79,107,0.55);
  }

  .badge-count{
    animation: pop 0.25s ease;
  }
  @keyframes pop{
    0%{ transform: scale(0.5); } 60%{ transform: scale(1.15); } 100%{ transform: scale(1); }
  }

  .modal-sheet{
    animation: slide-up 0.28s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes slide-up{
    from{ transform: translateY(30px); opacity: 0; }
    to{ transform: translateY(0); opacity: 1; }
  }
  .backdrop-fade{ animation: fade-in 0.2s ease; }
  @keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }

  .scan-line{
    position: absolute; left: 8%; right: 8%; height: 2px;
    background: linear-gradient(90deg, transparent, #21E6C1, transparent);
    box-shadow: 0 0 10px 2px #21E6C1;
    animation: scan-move 2s ease-in-out infinite;
  }
  @keyframes scan-move{
    0%{ top: 12%; } 50%{ top: 85%; } 100%{ top: 12%; }
  }

  ::-webkit-scrollbar{ width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 10px; }

  .qty-pill{
    background: #EAF6F6; color: var(--brand-2); border: 1px solid #D3EFEF;
  }
  .qty-pill.low{ background: #FFF1EC; color: var(--accent); border-color: #FFDDCC; }
</style>
</head>
<body class="min-h-screen pb-28">

  <!-- ===== Top Bar ===== -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b" style="border-color:var(--line)">
    <div class="px-4 pt-4 pb-3">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h1 class="font-display text-lg font-extrabold" style="color:var(--brand)">نقطة البيع</h1>
          <p class="text-xs" style="color:var(--ink-soft)">محل الهواتف والإكسسوارات</p>
        </div>
        <div class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-sm" style="background:var(--brand)">م</div>
      </div>

      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <svg class="absolute right-3 top-1/2 -translate-y-1/2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
          <input id="searchInput" type="text" placeholder="ابحث عن منتج أو باركود..."
            class="w-full h-11 rounded-2xl bg-[var(--bg)] pr-10 pl-4 text-sm outline-none border focus:ring-2 transition"
            style="border-color:var(--line); --tw-ring-color: var(--brand-2)">
        </div>
        <button id="scanBtn" class="relative shrink-0 w-11 h-11 rounded-2xl scan-btn flex items-center justify-center text-white shadow-lg active:scale-95 transition">
          <span class="scan-ring"></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <line x1="7" y1="12" x2="17" y2="12"/>
          </svg>
        </button>
      </div>

      <!-- category chips -->
      <div id="chipRow" class="flex gap-2 mt-3 overflow-x-auto pb-1" style="scrollbar-width:none"></div>
    </div>
  </header>

  <!-- ===== Products Grid ===== -->
  <main class="px-4 pt-4">
    <div id="productGrid" class="grid grid-cols-2 gap-3"></div>
    <p id="emptyState" class="hidden text-center text-sm py-14" style="color:var(--ink-soft)">لا توجد نتائج مطابقة لبحثك</p>
  </main>

  <!-- ===== Floating Cart Button ===== -->
  <button id="cartFab" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 fab-cart text-white rounded-full h-14 pl-5 pr-6 flex items-center gap-3 active:scale-95 transition">
    <span class="relative flex items-center justify-center w-8 h-8 bg-white/20 rounded-full">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span id="cartCount" class="badge-count absolute -top-2 -left-2 bg-[var(--accent)] text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
    </span>
    <span class="font-display font-bold text-sm">السلة</span>
    <span id="cartTotalMini" class="font-bold text-sm border-r pr-3 border-white/30">0 دج</span>
  </button>

  <!-- ===== Scanner Modal ===== -->
  <div id="scanModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-fade" onclick="closeScanner()"></div>
    <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 modal-sheet">
      <div class="bg-[var(--ink)] rounded-3xl overflow-hidden shadow-2xl">
        <div class="flex items-center justify-between px-4 py-3">
          <h3 class="text-white font-display font-bold text-sm">وجّه الكاميرا نحو الباركود</h3>
          <button onclick="closeScanner()" class="text-white/70 w-8 h-8 flex items-center justify-center">✕</button>
        </div>
        <div class="relative">
          <div id="reader" class="w-full"></div>
          <div class="scan-line"></div>
        </div>
        <p id="scanStatus" class="text-center text-white/60 text-xs py-3">جاري تشغيل الكاميرا...</p>
      </div>
    </div>
  </div>

  <!-- ===== Cart Modal ===== -->
  <div id="cartModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-fade" onclick="toggleCart(false)"></div>
    <div class="absolute inset-x-0 bottom-0 modal-sheet">
      <div class="bg-white rounded-t-3xl max-h-[85vh] flex flex-col">
        <div class="w-10 h-1.5 bg-gray-300 rounded-full mx-auto mt-3"></div>
        <div class="flex items-center justify-between px-5 pt-3 pb-2">
          <h3 class="font-display font-extrabold text-lg" style="color:var(--brand)">تأكيد عملية البيع</h3>
          <button onclick="toggleCart(false)" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500">✕</button>
        </div>

        <div id="cartItems" class="flex-1 overflow-y-auto px-5 py-2 space-y-3"></div>

        <div id="cartEmptyMsg" class="hidden text-center py-10 text-sm" style="color:var(--ink-soft)">السلة فارغة، امسح أو اختر منتجاً لإضافته</div>

        <div class="px-5 pt-3 pb-6 border-t" style="border-color:var(--line)">
          <div class="flex justify-between text-sm mb-1" style="color:var(--ink-soft)">
            <span>عدد القطع</span><span id="sumItems">0</span>
          </div>
          <div class="flex justify-between font-display font-extrabold text-xl mb-4" style="color:var(--brand)">
            <span>الإجمالي</span><span id="sumTotal">0 دج</span>
          </div>
          <button id="checkoutBtn" onclick="checkout()" class="w-full h-13 py-3.5 rounded-2xl text-white font-display font-bold text-base scan-btn active:scale-95 transition disabled:opacity-40" style="background:linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%)">
            إتمام الدفع
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] hidden">
    <div class="bg-[var(--ink)] text-white text-sm px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2">
      <span id="toastIcon">✓</span><span id="toastMsg"></span>
    </div>
  </div>

<script>
// ================= Data =================
const products = [
  { id:1, name:'iPhone 13 - 128GB', price:78000, qty:6, cat:'هواتف', barcode:'100000000001', color:'#0E4F6B' },
  { id:2, name:'Samsung A54 5G', price:52000, qty:11, cat:'هواتف', barcode:'100000000002', color:'#0FA3A3' },
  { id:3, name:'Redmi Note 13', price:32000, qty:18, cat:'هواتف', barcode:'100000000003', color:'#FF7A45' },
  { id:4, name:'سماعة AirPods Pro', price:14500, qty:9, cat:'إكسسوارات', barcode:'100000000004', color:'#0E4F6B' },
  { id:5, name:'شاحن سريع 33W', price:2200, qty:34, cat:'إكسسوارات', barcode:'100000000005', color:'#0FA3A3' },
  { id:6, name:'غطاء حماية شفاف', price:900, qty:50, cat:'إكسسوارات', barcode:'100000000006', color:'#FF7A45' },
  { id:7, name:'حافظة شاشة زجاجية', price:600, qty:3, cat:'إكسسوارات', barcode:'100000000007', color:'#0E4F6B' },
  { id:8, name:'باور بانك 20000mAh', price:5200, qty:14, cat:'إكسسوارات', barcode:'100000000008', color:'#0FA3A3' },
  { id:9, name:'Samsung S23 Ultra', price:135000, qty:2, cat:'هواتف', barcode:'100000000009', color:'#FF7A45' },
  { id:10,name:'سماعة بلوتوث JBL', price:8700, qty:7, cat:'إكسسوارات', barcode:'100000000010', color:'#0E4F6B' },
];

let cart = {}; // id -> qty
let currentFilter = 'الكل';
let html5QrCode = null;

// ================= Rendering =================
function fmt(n){ return n.toLocaleString('ar-DZ') + ' دج'; }

function renderChips(){
  const cats = ['الكل', ...new Set(products.map(p=>p.cat))];
  const row = document.getElementById('chipRow');
  row.innerHTML = cats.map(c => `
    <button data-cat="${c}" class="chip-btn shrink-0 px-4 py-1.5 rounded-full text-xs font-bold border transition ${c===currentFilter ? 'text-white' : ''}"
      style="${c===currentFilter ? 'background:var(--brand); border-color:var(--brand)' : 'border-color:var(--line); color:var(--ink-soft)'}">
      ${c}
    </button>`).join('');
  row.querySelectorAll('.chip-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentFilter = btn.dataset.cat; renderChips(); renderProducts(); });
  });
}

function renderProducts(){
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('productGrid');
  const filtered = products.filter(p=>{
    const matchCat = currentFilter==='الكل' || p.cat===currentFilter;
    const matchTerm = !term || p.name.toLowerCase().includes(term) || p.barcode.includes(term);
    return matchCat && matchTerm;
  });

  document.getElementById('emptyState').classList.toggle('hidden', filtered.length>0);
  grid.innerHTML = filtered.map(p=>{
    const low = p.qty <= 5;
    return `
    <div class="card-tap relative bg-white rounded-2xl p-3 border shadow-sm active:shadow-md transition cursor-pointer" style="border-color:var(--line)" onclick="addToCart(${p.id})">
      <div class="absolute inset-0 barcode-mark rounded-2xl pointer-events-none"></div>
      <div class="relative flex items-center justify-center h-16 rounded-xl mb-2" style="background:${p.color}14">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${p.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>
        </svg>
      </div>
      <p class="relative text-sm font-bold leading-snug mb-1 line-clamp-2" style="color:var(--ink)">${p.name}</p>
      <div class="relative flex items-center justify-between mt-2">
        <span class="font-display font-extrabold text-sm" style="color:var(--brand)">${fmt(p.price)}</span>
        <span class="qty-pill ${low?'low':''} text-[10px] font-bold px-2 py-1 rounded-full">${p.qty} قطعة</span>
      </div>
    </div>`;
  }).join('');
}

function renderCart(){
  const items = Object.entries(cart);
  const wrap = document.getElementById('cartItems');
  const emptyMsg = document.getElementById('cartEmptyMsg');
  const checkoutBtn = document.getElementById('checkoutBtn');

  let totalQty = 0, totalPrice = 0;
  if(items.length===0){
    wrap.innerHTML = '';
    emptyMsg.classList.remove('hidden');
    checkoutBtn.disabled = true;
  } else {
    emptyMsg.classList.add('hidden');
    checkoutBtn.disabled = false;
    wrap.innerHTML = items.map(([id,qty])=>{
      const p = products.find(pr=>pr.id==id);
      totalQty += qty; totalPrice += qty*p.price;
      return `
      <div class="flex items-center gap-3 pb-3 border-b" style="border-color:var(--line)">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style="background:${p.color}14">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${p.color}" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold truncate">${p.name}</p>
          <p class="text-xs" style="color:var(--ink-soft)">${fmt(p.price)}</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="changeQty(${p.id},-1)" class="w-7 h-7 rounded-full bg-gray-100 font-bold">−</button>
          <span class="w-5 text-center font-bold text-sm">${qty}</span>
          <button onclick="changeQty(${p.id},1)" class="w-7 h-7 rounded-full bg-gray-100 font-bold">+</button>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('sumItems').textContent = totalQty;
  document.getElementById('sumTotal').textContent = fmt(totalPrice);
  document.getElementById('cartCount').textContent = totalQty;
  document.getElementById('cartTotalMini').textContent = fmt(totalPrice);
}

// ================= Cart logic =================
function addToCart(id){
  const p = products.find(pr=>pr.id===id);
  const current = cart[id] || 0;
  if(current >= p.qty){ showToast('الكمية المتوفرة غير كافية', '⚠'); return; }
  cart[id] = current + 1;
  renderCart();
  showToast(`تمت إضافة "${p.name}"`, '✓');
}

function changeQty(id, delta){
  const p = products.find(pr=>pr.id===id);
  const next = (cart[id]||0) + delta;
  if(next <= 0){ delete cart[id]; }
  else if(next > p.qty){ showToast('الكمية المتوفرة غير كافية', '⚠'); return; }
  else { cart[id] = next; }
  renderCart();
}

function checkout(){
  const items = Object.entries(cart);
  if(items.length===0) return;
  items.forEach(([id,qty])=>{
    const p = products.find(pr=>pr.id==id);
    p.qty -= qty;
  });
  cart = {};
  renderCart();
  renderProducts();
  toggleCart(false);
  showToast('تمت عملية البيع بنجاح', '✓');
}

function toggleCart(show){
  document.getElementById('cartModal').classList.toggle('hidden', !show);
}
document.getElementById('cartFab').addEventListener('click', ()=>toggleCart(true));

// ================= Toast =================
let toastTimer;
function showToast(msg, icon='✓'){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = icon;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.add('hidden'), 1800);
}

// ================= Search =================
document.getElementById('searchInput').addEventListener('input', renderProducts);

// ================= Barcode Scanner =================
function openScanner(){
  document.getElementById('scanModal').classList.remove('hidden');
  document.getElementById('scanStatus').textContent = 'جاري تشغيل الكاميرا...';
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 240, height: 140 } };
  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    ()=>{ /* scan failure per frame, ignore */ }
  ).then(()=>{
    document.getElementById('scanStatus').textContent = 'ضع الباركود داخل الإطار';
  }).catch(err=>{
    document.getElementById('scanStatus').textContent = 'تعذر الوصول إلى الكاميرا — تحقق من الأذونات';
  });
}

function onScanSuccess(decodedText){
  const p = products.find(pr=>pr.barcode === decodedText);
  closeScanner();
  if(p){
    addToCart(p.id);
  } else {
    document.getElementById('searchInput').value = decodedText;
    renderProducts();
    showToast('لم يتم العثور على المنتج، جرى البحث بالكود', '⚠');
  }
}

function closeScanner(){
  const modal = document.getElementById('scanModal');
  if(html5QrCode){
    html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{});
  }
  modal.classList.add('hidden');
}

document.getElementById('scanBtn').addEventListener('click', openScanner);

// ================= Init =================
renderChips();
renderProducts();
renderCart();
</script>
</body>
</html>
